name: PriceTracker 24/7 Periodic Sweep
run-name: PriceTracker 24/7 Sweep (${{ github.event_name }})

on:
  schedule:
    # Runs every 5 minutes on GitHub's free runners (100% free & unlimited on public repositories)
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: tracker-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Price & Deal Radar Sweep (100% GitHub Runner - 0 Vercel Fluid CPU)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CASIO_BHAWAR_EMAIL: ${{ secrets.CASIO_BHAWAR_EMAIL }}
          CASIO_BHAWAR_PASSWORD: ${{ secrets.CASIO_BHAWAR_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python run_247_radar.py --once
